name: R36S CFW graphics

on:
  push:
    branches: [r36s-cfw]
    paths:
      - 'cfw/config/buildroot-r36s-mesa_defconfig'
      - 'cfw/rootfs-overlay/**'
      - 'cfw/scripts/build-graphics.sh'
      - 'cfw/scripts/prepare-buildroot-mesa.sh'
      - 'cfw/scripts/post-build-rootfs.sh'
      - 'cfw/scripts/fetch-sources.sh'
      - 'cfw/external.desc'
      - 'cfw/Config.in'
      - 'cfw/external.mk'
      - 'cfw/versions.env'
      - '.github/workflows/r36s-cfw-graphics.yml'
  workflow_dispatch:

concurrency:
  group: r36s-cfw-graphics
  cancel-in-progress: true

jobs:
  graphics:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: cfw/.cache/downloads
          key: r36s-buildroot-downloads-2026.08-mesa-26.2.3

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: r36s-buildroot-ccache-mesa-26.2.3-${{ github.sha }}
          restore-keys: |
            r36s-buildroot-ccache-mesa-26.2.3-

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential git rsync cpio unzip file             bc bison flex libssl-dev libncurses-dev             python3 perl patch wget curl

      - name: Fetch Buildroot 2026.08
        run: sh cfw/scripts/fetch-sources.sh buildroot

      - name: Build Mesa 26.2.3 Panfrost rootfs
        env:
          JOBS: 4
        run: sh cfw/scripts/build-graphics.sh

      - name: Validate graphics userspace
        run: |
          test -x cfw/out/graphics/target/usr/bin/kmscube
          test -x cfw/out/graphics/target/usr/bin/r36s-gpu-probe
          file cfw/out/graphics/target/usr/bin/r36s-gpu-probe
          grep '^BR2_PACKAGE_R36S_GPU_PROBE=y
          find cfw/out/graphics/target/usr/lib/dri -maxdepth 1 -type f -o -type l | tee cfw/out/artifacts/graphics-dri-files.txt
          grep -R "Version: 26.2.3" cfw/out/graphics/staging/usr/lib/pkgconfig cfw/out/graphics/staging/usr/share/pkgconfig
          if find cfw/out/graphics/target/usr/lib -maxdepth 1 -name 'libLLVM*' | grep -q .; then
            echo "target LLVM libraries found; graphics image is not lean" >&2
            exit 1
          fi
          grep '^BR2_PACKAGE_MESA3D_GALLIUM_DRIVER_PANFROST=y$' cfw/out/artifacts/buildroot-r36s-mesa-26.2.3.config
          grep '^BR2_PACKAGE_KMSCUBE=y$' cfw/out/artifacts/buildroot-r36s-mesa-26.2.3.config
          file cfw/out/artifacts/rootfs-r36s-mesa-26.2.3.ext4

      - name: Upload graphics rootfs
        uses: actions/upload-artifact@v4
        with:
          name: r36s-cfw-mesa-26.2.3-panfrost
          path: |
            cfw/out/artifacts/rootfs-r36s-mesa-26.2.3.ext4
            cfw/out/artifacts/buildroot-r36s-mesa-26.2.3.config
            cfw/out/artifacts/graphics-dri-files.txt
            cfw/boot/boot.ini
            cfw/docs/FIRST_BOOT.md
            cfw/docs/GRAPHICS.md
          if-no-files-found: error
 cfw/out/artifacts/buildroot-r36s-mesa-26.2.3.config
          test -d cfw/out/graphics/target/usr/lib/dri
          find cfw/out/graphics/target/usr/lib/dri -maxdepth 1 -type f -o -type l | tee cfw/out/artifacts/graphics-dri-files.txt
          grep -R "Version: 26.2.3" cfw/out/graphics/staging/usr/lib/pkgconfig cfw/out/graphics/staging/usr/share/pkgconfig
          if find cfw/out/graphics/target/usr/lib -maxdepth 1 -name 'libLLVM*' | grep -q .; then
            echo "target LLVM libraries found; graphics image is not lean" >&2
            exit 1
          fi
          grep '^BR2_PACKAGE_MESA3D_GALLIUM_DRIVER_PANFROST=y$' cfw/out/artifacts/buildroot-r36s-mesa-26.2.3.config
          grep '^BR2_PACKAGE_KMSCUBE=y$' cfw/out/artifacts/buildroot-r36s-mesa-26.2.3.config
          file cfw/out/artifacts/rootfs-r36s-mesa-26.2.3.ext4

      - name: Upload graphics rootfs
        uses: actions/upload-artifact@v4
        with:
          name: r36s-cfw-mesa-26.2.3-panfrost
          path: |
            cfw/out/artifacts/rootfs-r36s-mesa-26.2.3.ext4
            cfw/out/artifacts/buildroot-r36s-mesa-26.2.3.config
            cfw/out/artifacts/graphics-dri-files.txt
            cfw/boot/boot.ini
            cfw/docs/FIRST_BOOT.md
            cfw/docs/GRAPHICS.md
          if-no-files-found: error
