name: Publish verified main alpha

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-main-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: r36s-alpha-2026-09-26
      RELEASE_TITLE: "ARM-GE R36S ARM64 Alpha — 2026-09-26"
      TARGET_SHA: b99176f0573f3a41fdc7c05f1bfca263d44931ba
      SOURCE_RUN_ID: "36214485653"
      ARTIFACT_NAME: ge007-r36s-portmaster-alpha
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Re-verify release payload
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/dist/ge007.zip
          test -f release-assets/dist/ge007.zip.sha256
          test -f release-assets/build/arm64/ge007.aarch64
          test -f release-assets/build/arm64/ge007.sha256
          expected_zip="$(awk '{print $1}' release-assets/dist/ge007.zip.sha256)"
          actual_zip="$(sha256sum release-assets/dist/ge007.zip | awk '{print $1}')"
          test "$actual_zip" = "$expected_zip"
          expected_bin="$(awk '{print $1}' release-assets/build/arm64/ge007.sha256)"
          actual_bin="$(sha256sum release-assets/build/arm64/ge007.aarch64 | awk '{print $1}')"
          test "$actual_bin" = "$expected_bin"
          unzip -t release-assets/dist/ge007.zip
          if unzip -Z1 release-assets/dist/ge007.zip | grep -Eq '\.(z64|n64|v64)$|(^|/)(pcmodels|pccg)\.bin$'; then
            echo "Refusing to publish ROM or generated ROM-derived data" >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # ARM-GE R36S ARM64 Alpha

          Experimental native AArch64 build of the reconstructed GoldenEye 007 codebase for R36S-class Linux handhelds using SDL2 + OpenGL ES.

          **Build**
          - Source: `b99176f0573f3a41fdc7c05f1bfca263d44931ba`
          - GitHub Actions run: `36214485653`
          - Artifact: `ge007-r36s-portmaster-alpha`
          - Artifact bundle digest: `sha256:e55d86dd071e84bae67ff9fc69d836ed43f49c854051b5d3a3eb4898ad2357a1`
          - Target: R36S / dArkOSRE / PortMaster
          - Architecture: AArch64
          - Graphics: SDL2 + GLES

          **Included release assets**
          - `ge007.zip` — PortMaster installer
          - `ge007.zip.sha256` — installer checksum
          - `ge007.aarch64` — native executable
          - `ge007.sha256` — executable checksum

          **ROM requirement**

          No GoldenEye ROM or generated ROM-derived sidecars are included. Installers require the user to provide their own legally obtained GoldenEye 007 NTSC-U big-endian ROM at `ge007/data/ge007.ntsc-final.z64`.

          Expected ROM SHA-1: `abe01e4aeb033b6c0836819f549c791b26cfde83`.

          **Alpha status**

          This is an experimental real-hardware alpha. Native ARM64 execution, SDL2/GLES rendering, menus, intro, in-mission rendering/gameplay, controller integration, PortMaster installation and first-run ROM-derived sidecar generation have been demonstrated.

          **September 26 stabilization**
          - Includes the ARM64 stale-player render-pointer fix for death and level-exit teardown.
          - Makes direct mouse aim displacement-stable instead of coupling it to host input-poll timing.
          - Stabilizes the crosshair when simulation ticks are batched, targeting the reported zoom/scope jitter on ARM handhelds.
          - Prevents absolute mouse aim from fighting scripted/death/pause cameras, including the Dam end-of-level cutscene.
          - Defaults the CPU/FPS/RAM diagnostic HUD off while keeping it available from the options overlay.
          - Hardens first mission-completion save creation against NULL old-save pointers.
          - Adds safe mission-save/title-handoff/stage-unload breadcrumbs to log.txt for any remaining transition failure.

          The Dam-completion path has been source-hardened and ARM64 CI-validated, but still needs fresh real-device confirmation from alpha testers. Long-session audio degradation and remaining cosmetic/rendering defects remain active work.
          EOF

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/dist/ge007.zip \
            release-assets/dist/ge007.zip.sha256 \
            release-assets/build/arm64/ge007.aarch64 \
            release-assets/build/arm64/ge007.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
