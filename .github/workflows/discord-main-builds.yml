name: Discord main green builds

on:
  workflow_run:
    workflows:
      - GoldenEye AArch64 R36S GLES Build
    branches:
      - main
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  notify:
    # #main-builds is the verified feed:
    # main push -> full R36S/AArch64 build passes -> one compact Discord card.
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_MAIN_BUILDS }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Build verified main summary
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        shell: bash
        run: |
          set -euo pipefail

          # Find the most recent earlier successful main/push build.  A single
          # source commit can cancel an earlier in-flight build, so comparing
          # only the triggering commit produces misleading "1 file" reports.
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPOSITORY/actions/workflows/build-r36s.yml/runs?branch=main&event=push&status=success&per_page=30" \
            > /tmp/runs.json

          python3 - <<'PY' > /tmp/base-sha.txt
          import json, os
          current_id = int(os.environ["RUN_ID"])
          current_sha = os.environ["SHA"]
          runs = json.load(open("/tmp/runs.json", encoding="utf-8")).get("workflow_runs", [])
          for run in runs:
              if int(run.get("id", 0)) == current_id:
                  continue
              sha = run.get("head_sha")
              if sha and sha != current_sha:
                  print(sha)
                  break
          PY

          BASE_SHA="$(cat /tmp/base-sha.txt 2>/dev/null || true)"

          if [ -n "$BASE_SHA" ]; then
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPOSITORY/compare/$BASE_SHA...$SHA" \
              > /tmp/change.json
          else
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPOSITORY/commits/$SHA" \
              > /tmp/commit.json
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            > /tmp/artifacts.json

          python3 - <<'PY' > /tmp/discord-payload.json
          import json
          import os
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          sha = os.environ["SHA"]
          short_sha = sha[:7]
          run_url = os.environ["RUN_URL"]
          base_sha_path = Path("/tmp/base-sha.txt")
          base_sha = base_sha_path.read_text(encoding="utf-8").strip() if base_sha_path.exists() else ""

          artifacts = json.load(open("/tmp/artifacts.json", encoding="utf-8")).get("artifacts", [])
          artifact = next((a for a in artifacts if a.get("name") == "ge007-r36s-portmaster-alpha"), None)
          artifact_text = "ge007-r36s-portmaster-alpha"
          if artifact:
              size = int(artifact.get("size_in_bytes") or 0)
              if size:
                  artifact_text += f" · {size / (1024*1024):.1f} MiB"
              if artifact.get("expired"):
                  artifact_text += " · expired"
              else:
                  artifact_text += " · ready"

          commit_count = 1
          changed = 0
          additions = 0
          deletions = 0
          subjects = []

          if Path("/tmp/change.json").exists():
              data = json.load(open("/tmp/change.json", encoding="utf-8"))
              commits = data.get("commits") or []
              files = data.get("files") or []
              commit_count = len(commits)
              changed = len(files)
              additions = sum(int(f.get("additions") or 0) for f in files)
              deletions = sum(int(f.get("deletions") or 0) for f in files)

              # Newest useful commit subjects first. Merge commits are omitted
              # when there are ordinary commits to show.
              ordinary = []
              merges = []
              for c in commits:
                  subject = ((c.get("commit") or {}).get("message") or "").splitlines()[0].strip()
                  if not subject:
                      continue
                  (merges if subject.lower().startswith("merge ") else ordinary).append(subject)
              pool = ordinary or merges
              subjects = list(reversed(pool))[:6]
          else:
              data = json.load(open("/tmp/commit.json", encoding="utf-8"))
              files = data.get("files") or []
              stats = data.get("stats") or {}
              changed = len(files)
              additions = int(stats.get("additions") or 0)
              deletions = int(stats.get("deletions") or 0)
              subject = ((data.get("commit") or {}).get("message") or "").splitlines()[0].strip()
              if subject:
                  subjects = [subject]

          highlights = "\n".join(f"• {s[:150]}" for s in subjects[:6])
          if not highlights:
              highlights = "• Verified main rebuild."

          omitted = max(0, commit_count - len(subjects))
          if omitted:
              highlights += f"\n• …plus {omitted} earlier commit{'s' if omitted != 1 else ''} in this green range"

          range_text = f"{base_sha[:7]} → {short_sha}" if base_sha else short_sha
          commit_url = f"https://github.com/{repo}/commit/{sha}"
          compare_url = f"https://github.com/{repo}/compare/{base_sha}...{sha}" if base_sha else commit_url

          embed = {
              "title": "✅ VERIFIED MAIN BUILD — GREEN",
              "url": run_url,
              "description": (
                  f"**{range_text}**\n"
                  f"{commit_count} commit{'s' if commit_count != 1 else ''} · "
                  f"{changed} file{'s' if changed != 1 else ''} · "
                  f"+{additions} / -{deletions}"
              ),
              "color": 0x57F287,
              "fields": [
                  {
                      "name": "Changes since previous green",
                      "value": highlights[:1024],
                      "inline": False,
                  },
                  {
                      "name": "Verification",
                      "value": (
                          "ARM64 semantic audit ✅\n"
                          "AArch64 build ✅\n"
                          "ELF verification ✅\n"
                          "PortMaster package validation ✅"
                      ),
                      "inline": True,
                  },
                  {
                      "name": "Artifact",
                      "value": artifact_text[:1024],
                      "inline": True,
                  },
                  {
                      "name": "Links",
                      "value": f"[Build run]({run_url}) · [Changes]({compare_url}) · [Commit]({commit_url})",
                      "inline": False,
                  },
              ],
              "footer": {
                  "text": f"ARM-GE main · {short_sha}"
              },
          }

          print(json.dumps({
              "username": "ARM-GE Build Bot",
              "content": "",
              "embeds": [embed],
              "allowed_mentions": {"parse": []},
          }))
          PY

      - name: Post green build to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            -H 'Content-Type: application/json' \
            -d @/tmp/discord-payload.json \
            "$DISCORD_WEBHOOK"
