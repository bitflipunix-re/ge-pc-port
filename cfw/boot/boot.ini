odroidgoa-uboot-config

# R36S CFW bring-up: keep the existing known-good U-Boot and replace
# only the kernel, DTB and root filesystem.
setenv bootargs "root=LABEL=ROOTFS rootfstype=ext4 rootwait rw init=/sbin/init fsck.repair=yes console=ttyS2,1500000 console=tty0 loglevel=7 ignore_loglevel"

setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x01f00000"

load mmc 1:1 ${loadaddr} Image
load mmc 1:1 ${dtb_loadaddr} rk3326-r36s.dtb

booti ${loadaddr} - ${dtb_loadaddr}
