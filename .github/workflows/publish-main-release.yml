name: Publish verified main alpha

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-main-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: r36s-alpha-2026-09-26-completion-pass
      RELEASE_TITLE: "ARM-GE R36S ARM64 Alpha — 2026-09-26 Completion Pass"
      TARGET_SHA: 09ce89bfa07fc2e9de37e14e1726a7739e813477
      SOURCE_RUN_ID: "36231558781"
      ARTIFACT_NAME: ge007-r36s-portmaster-alpha
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Re-verify release payload
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/dist/ge007.zip
          test -f release-assets/dist/ge007.zip.sha256
          test -f release-assets/build/arm64/ge007.aarch64
          test -f release-assets/build/arm64/ge007.sha256
          expected_zip="$(awk '{print $1}' release-assets/dist/ge007.zip.sha256)"
          actual_zip="$(sha256sum release-assets/dist/ge007.zip | awk '{print $1}')"
          test "$actual_zip" = "$expected_zip"
          expected_bin="$(awk '{print $1}' release-assets/build/arm64/ge007.sha256)"
          actual_bin="$(sha256sum release-assets/build/arm64/ge007.aarch64 | awk '{print $1}')"
          test "$actual_bin" = "$expected_bin"
          unzip -t release-assets/dist/ge007.zip
          if unzip -Z1 release-assets/dist/ge007.zip | grep -Eq '\.(z64|n64|v64)$|(^|/)(pcmodels|pccg)\.bin$'; then
            echo "Refusing to publish ROM or generated ROM-derived data" >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # ARM-GE R36S ARM64 Alpha

          Experimental native AArch64 build of the reconstructed GoldenEye 007 codebase for R36S-class Linux handhelds using SDL2 + OpenGL ES.

          **Build**
          - Source: `09ce89bfa07fc2e9de37e14e1726a7739e813477`
          - GitHub Actions run: `36231558781`
          - Artifact: `ge007-r36s-portmaster-alpha`
          - Artifact bundle digest: `sha256:9e4f7f2ff290937871c69e3b752339d177f2b7bb4e32fa402a3a7bd020faf4dd`
          - Target: R36S / dArkOSRE / PortMaster
          - Architecture: AArch64
          - Graphics: SDL2 + GLES

          **Included release assets**
          - `ge007.zip` — PortMaster installer
          - `ge007.zip.sha256` — installer checksum
          - `ge007.aarch64` — native executable
          - `ge007.sha256` — executable checksum

          **ROM requirement**

          No GoldenEye ROM or generated ROM-derived sidecars are included. Installers require the user to provide their own legally obtained GoldenEye 007 NTSC-U big-endian ROM at `ge007/data/ge007.ntsc-final.z64`.

          Expected ROM SHA-1: `abe01e4aeb033b6c0836819f549c791b26cfde83`.

          **Alpha status**

          This is an experimental real-hardware alpha. Native ARM64 execution, SDL2/GLES rendering, menus, intro, in-mission rendering/gameplay, controller integration, PortMaster installation and first-run ROM-derived sidecar generation have been demonstrated.

          **September 26 completion pass**
          - Integrates the host-width ARM64 semantic sweep across animation pointers, model render data, title/runtime buffers, language banks, background visibility data and character-action pointer tests.
          - Adds a CI semantic regression gate to catch reintroduced pointer truncation and token/pointer confusion before ARM64 builds publish.
          - Preserves host-width stage-setup rebasing for multiplayer and campaign setup data.
          - Hardens player-body teardown and first mission-completion save creation against stale/NULL host pointers.
          - Serializes a stage-boundary SFX flush to prevent residual voices/events accumulating across long sessions.
          - Makes absolute/direct mouse look displacement-stable, stabilizes batched-tick crosshair damping and yields correctly to scripted/death/pause cameras.
          - Persists watch-menu toggles and sliders when editing ends.
          - Keeps CPU/FPS/RAM diagnostics available while defaulting the intrusive HUD off.
          - Retains transition/save/unload breadcrumbs for remaining real-device failures.

          This build passed the ARM64 semantic audit, AArch64 cross-build, ELF verification and PortMaster package validation in GitHub Actions. Full campaign and long-session behavior still requires fresh real-device confirmation; remaining work is primarily runtime correctness, rendering/audio polish and broader hardware validation.
          EOF

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/dist/ge007.zip \
            release-assets/dist/ge007.zip.sha256 \
            release-assets/build/arm64/ge007.aarch64 \
            release-assets/build/arm64/ge007.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
