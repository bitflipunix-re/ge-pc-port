odroidgoa-uboot-config

# R36S CFW Chromebook copy-only bring-up.
# Match the known-good G80CA/R36S U-Boot loading contract exactly while
# keeping the installed SPL/U-Boot and partition table untouched.
setenv bootargs "rw rdinit=/sbin/init net.ifnames=0 fbcon=rotate:0 console=/dev/ttyFIQ0 console=tty0 loglevel=7 ignore_loglevel consoleblank=0 vt.global_cursor_default=0"

setenv loadaddr "0x02000000"
setenv initrd_loadaddr "0x01100000"
setenv dtb_loadaddr "0x01f00000"

load mmc 1:1 ${loadaddr} Image
load mmc 1:1 ${initrd_loadaddr} uInitrd
load mmc 1:1 ${dtb_loadaddr} rk3326-r36s-linux.dtb

booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr}
