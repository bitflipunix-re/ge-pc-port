name: Discord main build updates

on:
  workflow_run:
    workflows:
      - GoldenEye AArch64 R36S GLES Build
    branches:
      - main
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  notify:
    # #main-builds is deliberately the green, verified feed:
    # push to main -> full R36S/AArch64 build passes -> one Discord changelog.
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_MAIN_BUILDS }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      TITLE: ${{ github.event.workflow_run.display_title }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Build verified changelog
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/commits/$SHA" > /tmp/commit.json

          python3 - <<'PY' > /tmp/discord-payload.json
          import json
          import os
          import re

          with open("/tmp/commit.json", "r", encoding="utf-8") as f:
              commit = json.load(f)

          sha = os.environ["SHA"]
          short_sha = sha[:7]
          repo = os.environ["REPOSITORY"]
          run_url = os.environ["RUN_URL"]
          commit_url = commit.get("html_url") or f"https://github.com/{repo}/commit/{sha}"

          message = (commit.get("commit", {}).get("message") or os.environ.get("TITLE") or "").strip()
          parts = message.splitlines()
          subject = parts[0].strip() if parts else os.environ.get("TITLE", "main update")

          body_lines = []
          for raw in parts[1:]:
              line = raw.strip()
              if not line:
                  continue
              if re.match(r"^(Co-authored-by|Signed-off-by|Reviewed-by):", line, re.I):
                  continue
              body_lines.append(line)

          files = commit.get("files") or []
          stats = commit.get("stats") or {}
          changed = len(files)
          additions = int(stats.get("additions") or 0)
          deletions = int(stats.get("deletions") or 0)

          changelog = []
          if body_lines:
              for line in body_lines[:6]:
                  changelog.append(f"• {line[:220]}")
          else:
              for item in files[:6]:
                  name = item.get("filename", "unknown")
                  changelog.append(f"• {name[:180]}")
              if len(files) > 6:
                  changelog.append(f"• …and {len(files) - 6} more files")

          if not changelog:
              changelog.append("• Verified main-branch rebuild; no file delta reported by GitHub.")

          content = (
              "✅ **VERIFIED MAIN BUILD — GREEN**\n"
              f"{short_sha} — **{subject[:240]}**\n\n"
              "**Changelog**\n"
              + "\n".join(changelog)
              + f"\n\n**Diff:** {changed} files · +{additions} / -{deletions}"
              + "\n**Artifact:** ge007-r36s-portmaster-alpha"
              + f"\n[Build run]({run_url}) · [Commit]({commit_url})"
          )

          if len(content) > 1950:
              content = content[:1910].rstrip() + "\n…\n" + f"[Build run]({run_url})"

          print(json.dumps({
              "username": "ARM-GE Build Bot",
              "content": content,
              "allowed_mentions": {"parse": []},
          }))
          PY

      - name: Post green build and changelog to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            -H 'Content-Type: application/json' \
            -d @/tmp/discord-payload.json \
            "$DISCORD_WEBHOOK"
