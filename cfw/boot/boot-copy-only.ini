odroidgoa-uboot-config

# R36S CFW Chromebook copy-only bring-up.
# Keep the known-good installed SPL/U-Boot and existing partition table.
# Load kernel, DTB and compressed initramfs entirely from the FAT BOOT partition.
setenv bootargs "rw rdinit=/sbin/init console=ttyS2,1500000 console=tty0 loglevel=7 ignore_loglevel"

setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x01f00000"
setenv ramdisk_addr "0x08000000"

# Common R36S images expose the BOOT FAT partition as mmc 1:1.
# Some U-Boot builds enumerate the same card as mmc 0:1, so fall back.
if load mmc 1:1 ${loadaddr} Image; then
    setenv cfw_bootdev "1:1"
else
    if load mmc 0:1 ${loadaddr} Image; then
        setenv cfw_bootdev "0:1"
    else
        echo "R36S CFW: cannot load Image from mmc 1:1 or 0:1"
        reset
    fi
fi

if load mmc ${cfw_bootdev} ${dtb_loadaddr} rk3326-r36s.dtb; then
    echo "R36S CFW: loaded exact G80CA DTB"
else
    echo "R36S CFW: cannot load rk3326-r36s.dtb"
    reset
fi

if load mmc ${cfw_bootdev} ${ramdisk_addr} rootfs.cpio.gz; then
    setenv ramdisk_size ${filesize}
    echo "R36S CFW: loaded initramfs ${ramdisk_size} bytes"
else
    echo "R36S CFW: cannot load rootfs.cpio.gz"
    reset
fi

echo "R36S CFW: booting Linux 6.12 copy-only test"
booti ${loadaddr} ${ramdisk_addr}:${ramdisk_size} ${dtb_loadaddr}
