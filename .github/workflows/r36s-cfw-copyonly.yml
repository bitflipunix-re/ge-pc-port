name: R36S CFW copy-only bundle

on:
  push:
    branches: [r36s-cfw]
    paths:
      - '.github/workflows/r36s-cfw-copyonly.yml'
      - 'cfw/boot/boot-copy-only.ini'
  workflow_dispatch:

concurrency:
  group: r36s-cfw-copyonly
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio e2fsprogs zip u-boot-tools

      - name: Download proven kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: r36s-cfw-kernel-6.12.111
          path: input/kernel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36204659613

      - name: Download proven rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: r36s-cfw-rootfs-buildroot-2026.08
          path: input/rootfs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36202844336

      - name: Convert ext4 rootfs to compressed initramfs
        run: |
          set -eux
          ROOTFS=$(find input/rootfs -type f -name 'rootfs-r36s.ext4' -print -quit)
          test -n "$ROOTFS"
          sudo mkdir -p /mnt/r36s-root
          sudo mount -o loop,ro "$ROOTFS" /mnt/r36s-root
          sudo sh -c 'cd /mnt/r36s-root && find . -xdev -print0 | cpio --null -o --format=newc --owner=0:0' | gzip -9 > rootfs.cpio.gz
          sudo umount /mnt/r36s-root
          gzip -t rootfs.cpio.gz
          zcat rootfs.cpio.gz | cpio -it | grep -E '^\./sbin/init$|^sbin/init$'

      - name: Assemble Chromebook copy-only package
        run: |
          set -eux
          rm -rf cfw-copyonly-bundle
          mkdir -p cfw-copyonly-bundle/COPY_TO_BOOT
          IMAGE=$(find input/kernel -type f -name 'Image-*r36s' -print -quit)
          DTB=$(find input/kernel -type f -name 'rk3326-r36s.dtb' -print -quit)
          test -n "$IMAGE"
          test -n "$DTB"
          cp "$IMAGE" cfw-copyonly-bundle/COPY_TO_BOOT/Image
          cp "$DTB" cfw-copyonly-bundle/COPY_TO_BOOT/rk3326-r36s-linux.dtb
          mkimage -A arm64 -O linux -T ramdisk -C gzip \
            -n "R36S CFW Buildroot initramfs" \
            -d rootfs.cpio.gz cfw-copyonly-bundle/COPY_TO_BOOT/uInitrd
          dumpimage -l cfw-copyonly-bundle/COPY_TO_BOOT/uInitrd
          cp cfw/boot/boot-copy-only.ini cfw-copyonly-bundle/COPY_TO_BOOT/boot.ini
          cat > cfw-copyonly-bundle/README.txt <<'EOF'
          R36S CFW — G80CA PANEL-8 — CHROMEBOOK COPY-ONLY FIRST BOOT

          This package intentionally matches the known-good stock G80CA U-Boot contract:
            mmc 1:1
            Image at 0x02000000
            uInitrd at 0x01100000
            rk3326-r36s-linux.dtb at 0x01f00000
            booti with the three plain addresses

          It still uses Linux 6.12.111, the mainline G80CA Panel-8 DTB, and the
          Buildroot 2026.08 RAM root filesystem.

          BEFORE TESTING
          1. Back up every existing file from the FAT BOOT partition.
          2. Do not format or repartition the card.
          3. Do not use Chromebook Recovery Utility.

          INSTALL
          Copy all four files from COPY_TO_BOOT to the root of the FAT BOOT partition:
            Image
            uInitrd
            rk3326-r36s-linux.dtb
            boot.ini

          Safely eject the card, insert it into the R36S, and power on.

          ROLLBACK
          Restore the complete BOOT backup. Raw bootloader sectors and the partition
          table are untouched by this test.
          EOF
          (
            cd cfw-copyonly-bundle
            sha256sum COPY_TO_BOOT/Image COPY_TO_BOOT/uInitrd COPY_TO_BOOT/rk3326-r36s-linux.dtb COPY_TO_BOOT/boot.ini > SHA256SUMS
            zip -r ../r36s-cfw-g80ca-chromebook-copy-only.zip .
          )

      - name: Upload copy-only bundle
        uses: actions/upload-artifact@v4
        with:
          name: r36s-cfw-g80ca-chromebook-copy-only
          path: r36s-cfw-g80ca-chromebook-copy-only.zip
          if-no-files-found: error
