name: GoldenEye AArch64 R36S GLES Build

# Discord green-build + changelog end-to-end smoke test; no build semantics changed.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-r36s.yml'
      - '.github/workflows/discord-main-builds.yml'
      - 'work/goldeneye-pc-port/**'
      - 'bundle/**'
      - 'port/**'
      - 'package.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-r36s.yml'
      - 'work/goldeneye-pc-port/**'
      - 'bundle/**'
      - 'port/**'
      - 'package.py'
  workflow_dispatch:

concurrency:
  group: r36s-aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show commit
        run: git log -1 --oneline

      - name: ARM64 semantic regression gate
        run: python3 work/goldeneye-pc-port/tools_pc/arm64_semantic_audit.py

      - name: Validate PortMaster launcher and packager
        run: |
          bash -n 'port/GoldenEye 007.sh'
          ! grep -q -- '--benchmark-suite' 'port/GoldenEye 007.sh'
          python3 -m py_compile package.py

      - name: Install AArch64 cross-build dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          packages=(
            cmake make ccache pkg-config unzip file
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
            libc6-dev-arm64-cross
            libsdl2-dev libgles2-mesa-dev libegl1-mesa-dev zlib1g-dev
            libsdl2-2.0-0:arm64 libgles2:arm64 libegl1:arm64 zlib1g:arm64
          )

          # Ubuntu mirrors occasionally rotate a security-pocket package
          # between apt-get update and apt-get install. Refresh and retry the
          # complete transaction so a transient 404 cannot masquerade as a
          # source/build failure.
          install_ok=0
          for attempt in 1 2 3; do
            echo "APT install attempt $attempt/3"
            sudo apt-get -o Acquire::Retries=3 update
            if sudo apt-get -o Acquire::Retries=3 install -y "${packages[@]}"; then
              install_ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          if [ "$install_ok" -ne 1 ]; then
            echo "AArch64 dependency installation failed after 3 refreshed attempts" >&2
            exit 1
          fi

          mkdir -p /tmp/sdl2-arm64-dev
          cd /tmp
          rm -f libsdl2-dev_*_arm64.deb
          download_ok=0
          for attempt in 1 2 3; do
            echo "SDL2 arm64 dev download attempt $attempt/3"
            if apt-get -o Acquire::Retries=3 download libsdl2-dev:arm64; then
              download_ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
              sudo apt-get -o Acquire::Retries=3 update
            fi
          done
          if [ "$download_ok" -ne 1 ]; then
            echo "libsdl2-dev:arm64 download failed after 3 attempts" >&2
            exit 1
          fi
          SDL2_ARM64_DEB="$(ls -1 libsdl2-dev_*_arm64.deb | head -n1)"
          test -n "$SDL2_ARM64_DEB"
          dpkg-deb -x "$SDL2_ARM64_DEB" /tmp/sdl2-arm64-dev

          sudo ln -sf libSDL2-2.0.so.0 /usr/lib/aarch64-linux-gnu/libSDL2.so
          sudo ln -sf libGLESv2.so.2 /usr/lib/aarch64-linux-gnu/libGLESv2.so
          sudo ln -sf libEGL.so.1 /usr/lib/aarch64-linux-gnu/libEGL.so
          sudo ln -sf libz.so.1 /usr/lib/aarch64-linux-gnu/libz.so

      - name: Configure AArch64 GLES build
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
        run: |
          cmake -S work/goldeneye-pc-port -B build/arm64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_ASM_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_C_COMPILER_TARGET=aarch64 \
            -DCMAKE_CXX_COMPILER_TARGET=aarch64 \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DROMID=ntsc-final \
            -DCMAKE_BUILD_TYPE=Release \
            -DGE_BETA_RELEASE=ON \
            -DGE_DEV_PROBES=OFF \
            -DSDL2_INCLUDE_DIR=/usr/include/SDL2 \
            -DSDL2_LIBRARY=/usr/lib/aarch64-linux-gnu/libSDL2.so \
            -DZLIB_INCLUDE_DIR=/usr/include \
            -DZLIB_LIBRARY=/usr/lib/aarch64-linux-gnu/libz.so \
            -DGL_LIBRARY=/usr/lib/aarch64-linux-gnu/libGLESv2.so \
            -DCMAKE_C_FLAGS="-DUSE_GLES=1 -I/tmp/sdl2-arm64-dev/usr/include/aarch64-linux-gnu" \
            -DCMAKE_CXX_FLAGS="-DUSE_GLES=1 -I/tmp/sdl2-arm64-dev/usr/include/aarch64-linux-gnu" \
            2>&1 | tee configure.log
          grep -q "Target arch: aarch64 (64bit=TRUE)" configure.log
          grep -q "Output binary: ge007.aarch64" configure.log

      - name: Build ge007.aarch64
        run: cmake --build build/arm64 -j$(nproc)

      - name: Strip beta binary
        run: aarch64-linux-gnu-strip --strip-unneeded build/arm64/ge007.aarch64

      - name: Verify binary
        run: |
          file build/arm64/ge007.aarch64
          aarch64-linux-gnu-readelf -h build/arm64/ge007.aarch64 | tee build/arm64/ge007.elf-header.txt
          grep -q "Machine:.*AArch64" build/arm64/ge007.elf-header.txt
          sha256sum build/arm64/ge007.aarch64 | tee build/arm64/ge007.sha256

      - name: Build and validate PortMaster install zip
        run: |
          python3 package.py --game-bin build/arm64/ge007.aarch64 --out dist
          unzip -t dist/ge007.zip
          unzip -l dist/ge007.zip | tee dist/ge007.zip.list
          unzip -p dist/ge007.zip port.json | python3 -m json.tool >/dev/null
          unzip -Z1 dist/ge007.zip | grep -qx 'port.json'
          unzip -Z1 dist/ge007.zip | grep -qx 'gameinfo.xml'
          unzip -Z1 dist/ge007.zip | grep -qx 'README.md'
          unzip -Z1 dist/ge007.zip | grep -qx 'GoldenEye 007.sh'
          ! unzip -Z1 dist/ge007.zip | grep -q 'GoldenEye Benchmark.sh'
          unzip -Z1 dist/ge007.zip | grep -qx 'ge007/ge007.aarch64'
          ! strings build/arm64/ge007.aarch64 | grep -q -- '--benchmark'
          ! strings build/arm64/ge007.aarch64 | grep -q 'GE007 VIDEO DEBUG'
          ! unzip -Z1 dist/ge007.zip | grep -Eq '\.(z64|n64|v64)$|(^|/)(pcmodels|pccg)\.bin$'
          sha256sum dist/ge007.zip | tee dist/ge007.zip.sha256

      - name: Upload beta install
        uses: actions/upload-artifact@v4
        with:
          name: ge007-r36s-portmaster-beta
          path: |
            dist/ge007.zip
            dist/ge007.zip.sha256
            dist/ge007.zip.list
            build/arm64/ge007.aarch64
            build/arm64/ge007.elf-header.txt
            build/arm64/ge007.sha256
          if-no-files-found: error

      - name: Publish beta release
        if: contains(github.event.head_commit.message, '[beta-release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="r36s-beta-2026-09-26"
          TITLE="ARM-GE R36S Beta — 2026-09-26"
          cat > /tmp/release-notes.md <<'EOF'
          First player-focused ARM-GE beta package for R36S / PortMaster.

          Compiled in Release mode and stripped. Development-only benchmark
          code, the PortMaster benchmark launcher, DAM-lab HUD, render probes,
          and frame-dump/debug capture paths are excluded.

          ARM-GE Port Control, normal gameplay, crash handling, runtime error
          logging, ROM verification and first-run sidecar generation remain.

          Supply your own GoldenEye 007 US NTSC big-endian ROM as:
          ge007/data/ge007.ntsc-final.z64
          SHA-1: abe01e4aeb033b6c0836819f549c791b26cfde83
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ge007.zip dist/ge007.zip.sha256 --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release-notes.md --prerelease
          else
            gh release create "$TAG" dist/ge007.zip dist/ge007.zip.sha256 \
              --target "$GITHUB_SHA" --title "$TITLE" --notes-file /tmp/release-notes.md --prerelease
          fi
